[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-on-rails-cli"
version = "0.1.0"
description = "Terminal operator UX for Agent On Rails (bootstrap, status, AI Team, run/watch)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Agent On Rails" }]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
aor = "aor_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aor_cli"]

[tool.hatch.build.targets.wheel.sources]
"src/aor_cli" = "aor_cli"

[tool.hatch.build.targets.sdist]
include = ["src/aor_cli", "README.md", "pyproject.toml", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
