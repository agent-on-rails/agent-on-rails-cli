[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-on-rails-cli"
version = "0.3.0"
description = "Agent On Rails — terminal UI harness: specs, approval, plan, run, review."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Agent On Rails" }]
keywords = ["agent-on-rails", "cli", "tui", "specs"]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rich>=13.7",
  "textual>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://agent-on-rails.suherman.net"
Repository = "https://github.com/agent-on-rails/agent-on-rails-cli"
Documentation = "https://github.com/agent-on-rails/agent-on-rails-cli/blob/main/docs/getting-started.md"

[project.scripts]
aor = "aor_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aor_cli"]

[tool.hatch.build.targets.wheel.sources]
"src/aor_cli" = "aor_cli"

[tool.hatch.build.targets.wheel.force-include]
"src/aor_cli/gather/templates" = "aor_cli/gather/templates"

[tool.hatch.build.targets.sdist]
include = ["src/aor_cli", "README.md", "pyproject.toml", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
